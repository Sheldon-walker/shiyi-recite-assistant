<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Microsoft YaHei UI, Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#262a45" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#F4F5F9"/>
  <rect x="0" y="0" width="250" height="720" fill="#FBFBFD"/>
  <line x1="250" y1="0" x2="250" y2="720" stroke="#E7E9F1"/>

  <rect x="22" y="28" width="40" height="40" rx="12" fill="#5E54E8"/>
  <text x="42" y="55" fill="#FFFFFF" font-size="21" text-anchor="middle">忆</text>
  <text x="74" y="47" fill="#181B26" font-size="17" font-weight="700">拾忆</text>
  <text x="74" y="67" fill="#777F93" font-size="11">艾宾浩斯背诵助手</text>

  <text x="24" y="124" fill="#A5ABBB" font-size="11" letter-spacing="1">工作台</text>
  <text x="32" y="167" fill="#777F93" font-size="16">◷</text>
  <text x="56" y="167" fill="#5B6172" font-size="14">今日复习</text>
  <rect x="14" y="190" width="222" height="42" rx="10" fill="#EEECFF"/>
  <rect x="14" y="190" width="3" height="42" rx="1.5" fill="#5E54E8"/>
  <text x="32" y="217" fill="#554BD8" font-size="16">▤</text>
  <text x="56" y="217" fill="#554BD8" font-size="14" font-weight="600">全部计划</text>
  <text x="32" y="262" fill="#777F93" font-size="16">⚙</text>
  <text x="56" y="262" fill="#5B6172" font-size="14">设置</text>

  <rect x="18" y="330" width="214" height="128" rx="12" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="34" y="357" fill="#777F93" font-size="12">计划进度</text>
  <text x="216" y="357" fill="#5E54E8" font-size="14" font-weight="700" text-anchor="end">11 条</text>
  <text x="34" y="386" fill="#181B26" font-size="20" font-weight="700">8 进行中</text>
  <text x="34" y="413" fill="#16855F" font-size="12">3 已完成</text>
  <text x="34" y="438" fill="#777F93" font-size="11">本地 JSON · 自动保存</text>

  <!-- 顶部 -->
  <text x="286" y="62" fill="#181B26" font-size="26" font-weight="700">全部计划</text>
  <text x="286" y="88" fill="#777F93" font-size="13">所有背诵内容与完整的复习时间轴，按添加时间排列。</text>
  <rect x="1018" y="38" width="146" height="40" rx="10" fill="#5E54E8"/>
  <text x="1091" y="63" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">＋  添加背诵</text>

  <!-- 搜索与筛选 -->
  <rect x="286" y="112" width="320" height="36" rx="9" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="304" y="136" fill="#A5ABBB" font-size="16">⌕</text>
  <text x="326" y="135" fill="#A5ABBB" font-size="12">搜索背诵内容…</text>
  <rect x="950" y="112" width="214" height="36" rx="9" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="966" y="135" fill="#777F93" font-size="12">全部类型</text>
  <text x="1146" y="135" fill="#A5ABBB" font-size="11" text-anchor="end">▾</text>

  <!-- 计划卡 -->
  <rect x="286" y="168" width="878" height="526" rx="16" fill="#FFFFFF" stroke="#E7E9F1" filter="url(#sh)"/>
  <text x="312" y="204" fill="#181B26" font-size="17" font-weight="700">滕王阁序</text>
  <rect x="404" y="187" width="52" height="22" rx="6" fill="#EEECFF"/>
  <text x="430" y="202" fill="#554BD8" font-size="11" text-anchor="middle">古文</text>
  <rect x="462" y="187" width="68" height="22" rx="6" fill="#EEECFF"/>
  <text x="496" y="202" fill="#554BD8" font-size="11" text-anchor="middle">2 / 5</text>
  <text x="312" y="230" fill="#A5ABBB" font-size="11">创建于 2026年11月14日  ·  共 5 个复习节点  ·  时间轴 1 / 2 / 4 / 7 / 15 天</text>

  <!-- 时间轴 -->
  <line x1="336" y1="274" x2="1114" y2="274" stroke="#E7E9F1" stroke-dasharray="4 4"/>
  <g font-size="10" text-anchor="middle">
    <circle cx="336" cy="274" r="6" fill="#16855F"/><text x="336" y="259" fill="#16855F">第 1 天</text><text x="336" y="302" fill="#777F93">11.14</text><text x="336" y="318" fill="#16855F">✓ 已完成</text>
    <circle cx="530" cy="274" r="6" fill="#16855F"/><text x="530" y="259" fill="#16855F">第 2 天</text><text x="530" y="302" fill="#777F93">11.15</text><text x="530" y="318" fill="#16855F">✓ 已完成</text>
    <circle cx="724" cy="274" r="6" fill="#16855F"/><text x="724" y="259" fill="#16855F">第 4 天</text><text x="724" y="302" fill="#777F93">11.17</text><text x="724" y="318" fill="#16855F">✓ 已完成</text>
    <circle cx="918" cy="274" r="6" fill="#5E54E8"/><text x="918" y="259" fill="#554BD8">第 7 天</text><text x="918" y="302" fill="#777F93">11.20</text><text x="918" y="318" fill="#554BD8">今天</text>
    <circle cx="1114" cy="274" r="6" fill="#C8CCDA"/><text x="1114" y="259" fill="#A5ABBB">第 15 天</text><text x="1114" y="302" fill="#A5ABBB">11.28</text><text x="1114" y="318" fill="#A5ABBB">待复习</text>
  </g>

  <!-- AI 解析面板 -->
  <rect x="312" y="344" width="826" height="326" rx="12" fill="#F7F8FC" stroke="#E7E9F1"/>
  <rect x="312" y="344" width="826" height="42" rx="12" fill="#EEECFF"/>
  <text x="332" y="371" fill="#554BD8" font-size="13" font-weight="700">AI 解析</text>
  <text x="440" y="371" fill="#8B86C9" font-size="11">deepseek-flash · 2026-11-20 20:38</text>
  <text x="1118" y="371" fill="#554BD8" font-size="14" text-anchor="end">▾</text>

  <!-- AI 气泡 -->
  <rect x="332" y="402" width="620" height="96" rx="12" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="350" y="424" fill="#554BD8" font-size="11" font-weight="700">逐句翻译</text>
  <text x="350" y="446" fill="#3B4050" font-size="12">豫章故郡，洪都新府 —— 南昌是汉代的豫章郡治，如今是洪州的都督府。</text>
  <text x="350" y="468" fill="#3B4050" font-size="12">落霞与孤鹜齐飞，秋水共长天一色 —— 晚霞与野鸭一同飞翔，秋水与长天融为一体。</text>
  <text x="350" y="488" fill="#777F93" font-size="10">hover 显示：重新生成 / 清除缓存</text>

  <!-- 用户气泡 -->
  <rect x="742" y="510" width="376" height="44" rx="12" fill="#5E54E8"/>
  <text x="760" y="537" fill="#FFFFFF" font-size="12">「落霞与孤鹜齐飞」用了什么手法？</text>

  <!-- AI 回复 -->
  <rect x="332" y="566" width="640" height="56" rx="12" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="350" y="590" fill="#3B4050" font-size="12">对偶 + 动静结合：以「落霞」「秋水」的静景衬托「孤鹜齐飞」的动景，</text>
  <text x="350" y="610" fill="#3B4050" font-size="12">色彩与空间交织，画面感极强。划选这段文字可直接引用追问。</text>

  <!-- 输入框 -->
  <rect x="332" y="630" width="620" height="28" rx="8" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="348" y="649" fill="#A5ABBB" font-size="11">就这段解析追问…</text>
  <rect x="962" y="630" width="56" height="28" rx="8" fill="#5E54E8"/>
  <text x="990" y="649" fill="#FFFFFF" font-size="11" text-anchor="middle">发送</text>
</svg>

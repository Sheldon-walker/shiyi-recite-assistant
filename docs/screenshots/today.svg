  <rect x="312" y="498" width="78" height="22" rx="6" fill="#EEECFF"/>
  <text x="351" y="513" fill="#554BD8" font-size="11" text-anchor="middle">英语单词</text>
  <rect x="396" y="498" width="68" height="22" rx="6" fill="#EEECFF"/>
  <text x="430" y="513" fill="#554BD8" font-size="11" text-anchor="middle">第 4 天</text>
  <rect x="470" y="498" width="76" height="22" rx="6" fill="#FFF3E2"/>
  <text x="508" y="513" fill="#B46912" font-size="11" text-anchor="middle">已逾期 1 天</text>
  <text x="558" y="513" fill="#A5ABBB" font-size="11">创建于 2026年11月17日</text>
  <text x="312" y="551" fill="#777F93" font-size="12">resilient / abundant / negotiate</text>
  <rect x="1030" y="490" width="104" height="34" rx="9" fill="#FFFFFF" stroke="#E7E9F1"/>
  <text x="1082" y="512" fill="#5B6172" font-size="12" text-anchor="middle">编辑</text>
  <rect x="1030" y="532" width="104" height="34" rx="9" fill="#EEECFF"/>
  <text x="1082" y="554" fill="#554BD8" font-size="12" text-anchor="middle">AI 解析</text>
